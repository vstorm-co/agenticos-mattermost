name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}-${{ github.event_name == 'push' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache-dependency-path: go.sum
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: go
          build-mode: manual
      - run: go build -mod=readonly -o /tmp/agenticos-mattermost-plugin ./server
        env:
          GOTOOLCHAIN: go1.26.11
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
